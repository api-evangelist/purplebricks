summary: 'Purplebricks publishes 18 first-party packages to NuGet, all of them internal .NET platform
  infrastructure open-sourced from its Azure estate — chiefly the "Pat" family of Azure Service Bus sender/subscriber
  libraries and PB.ITOps.AspNetCore.Versioning, the API versioning convention visible in the versioned
  Swagger document groups. IMPORTANT: none of these is a client SDK for a Purplebricks API. No client
  library exists for the property, account, valuations, viewings, messaging, lettings, branch, communications,
  conveyancing, agent, feedback, workflow or outlook services, in any language. npm, PyPI, RubyGems, Packagist,
  crates.io and pkg.go.dev return no first-party Purplebricks package.'

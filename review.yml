  reason: 'Sixteen genuine OpenAPI 3.0.1 documents were harvested verbatim from the live Purplebricks
    estate and saved to openapi/ (originals in openapi/_original/). Thirteen apis[] entries were wired,
    one per microservice, each with its public Swagger UI as humanURL and https://api.purplebricks.co.uk/<service>-api
    as baseURL. Nothing was invented. Pointers that would have over-claimed were deliberately withheld:
    no Webhooks pointer (the only webhook surface is inbound), no MCPServer pointer (candidate tools only,
    no server exists), no SDKs pointer (no client library exists), no Idempotency pointer (no idempotency
    key exists), no WellKnown pointer (every probe 404), no StatusPage / Deprecation / Security / Compliance
    pointers (none published).'

aid: purplebricks
name: Purplebricks
review:
  question: Does Purplebricks publish a public, documented, machine-readable API surface — and is there
    any RESO posture to record?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: brokerage
  status: enriched
  answerNuance: 'Documented: NO. Machine-readable and publicly served: YES. Sixteen OpenAPI 3.0.1 documents
    and thirteen public Swagger UIs are live on api.purplebricks.co.uk / www.purplebricks.co.uk, but there
    is no developer programme, no documentation site and no token issuance, so they are published-but-undeclared
    rather than a product.'
  revision:
    round: 2026-07-26 enrichment
    corrects: The first-round finding "no public API, zero specs harvested" was WRONG and is superseded.
    why_the_first_round_missed_it: 'Only host-root paths were probed (api.purplebricks.co.uk/swagger,
      /swagger/v1/swagger.json, /openapi.json), which 404 behind Azure Front Door. The specs are served
      one level down, per microservice, at /<service>-api/swagger/v1/swagger.json. The robots.txt disclosure
      of /outlook-api/v1/agent/outlook-sync was the thread: its sibling /outlook-api/swagger/v1/swagger.json
      parses as OpenAPI, and the same pattern holds for twelve more services.'
sectorBlock:
  resoPosture:
    phrase: no RESO reference found
    certified: false
    certificationType: none
    dataDictionaryVersion: null
    webApiCertified: false
    directoryEvidence: 'No RESO certification of any kind was found for Purplebricks. RESO (Real Estate

      Standards Organization) is a North American body whose Web API and Data Dictionary

      certifications are carried by MLSs, MLS technology vendors and North American

      brokerages. The United Kingdom has no MLS, so there is no cooperative endpoint for

      a UK agency to certify. Searches of the RESO certification material and of the

      Purplebricks estate returned zero hits for "RESO", "Data Dictionary", "OData",

      "UPI" or "Universal Property Identifier". No $metadata document is served

      (https://www.purplebricks.co.uk/$metadata -> HTTP 404).

      '
    upiPresent: false
    odataEndpointFound: false
    metadataDocumentFound: false
    note: 'Certification is not reachability, and here neither exists: Purplebricks is neither

      RESO-certified nor exposing any OData surface. The honest finding for a UK brokerage

      is simply that RESO is absent from the market, not that it is present-but-gated.

      '
  accessGate:
    classification: published-but-undeclared
    whatADeveloperMustSignOrJoin: 'Nothing is offered to sign or join, and that is now the sharper finding:
      the contracts are public but the credential is not. There is no developer programme, no partner
      API programme, no application form, no sandbox and no key issuance. Every one of the 205 operations
      requires an Authorization: Bearer token issued inside Purplebricks; anonymous calls return 401 with
      a ProblemDetails body. A third party wanting Purplebricks listing data still goes to the portals
      (Rightmove, Zoopla, OnTheMarket, PrimeLocation) under a commercial licence with those portals, not
      with Purplebricks.'
    gated: true
    selfServePortal: false
    membershipRequired: false
    licenceAgreementRequired: false
    brokerOrAgentOnly: false
  openData:
    publishesOpenData: false
    consumesOpenData: true
    detail: 'Purplebricks publishes no open dataset and no open API. It is, however, a CONSUMER of

      the UK''s genuinely open government property data layer: the /house-prices tool is

      explicitly attributed to HM Land Registry ("View the most recent property sales across

      England and Wales, using data from HM Land Registry", and the page meta description

      repeats "with data from HM Land Registry"). That is the UK counterweight to US private

      control — the open layer is public sector (HM Land Registry Price Paid / ownership data,

      Ordnance Survey addressing and mapping), and the private market layer (Rightmove /

      Zoopla duopoly plus agency CRM software) is closed. Purplebricks sits entirely on the

      closed side while re-presenting the open side to consumers through HTML pages.

      '
    openDataSetsPublishedByOrg: []
  authModel:
    scheme: bearer token (apiKey-in-header scheme), no public issuance
    detail: 'A single security scheme is declared in all sixteen documents and applied globally: name
      "Bearer", type apiKey, in header, parameter Authorization, described as "Authorization header using
      Bearer scheme" — the ASP.NET Swashbuckle convention. There is no OAuth 2.0 flow, no scopes, no token
      endpoint, no RFC 8414 authorization-server metadata and no OpenID Connect discovery (404 on every
      host). Tokens are issued by an undisclosed internal issuer.'
  webhooksEventsSdksPostman:
    webhooks: false
    webhooksInbound: true
    events: false
    sdks: false
    postman: false
    detail: 'No outbound webhooks and no event subscription surface — a third party cannot subscribe to
      anything. The only webhook surface in the estate is INBOUND: lettings-api exposes POST /v1/streetwebhooks
      and /v1/streetwebhooks/listing, which consume street.co.uk listing webhooks. No AsyncAPI document.
      No client SDK for any Purplebricks API in any language, and no Postman collection. Purplebricks
      does publish 18 first-party NuGet packages via its GitHub org — the "Pat" Azure Service Bus sender/subscriber
      family plus PB.ITOps.AspNetCore.Versioning, the versioning convention visible in the versioned Swagger
      document groups — but every one is internal platform infrastructure, not an API client.'
  productApiFamily:
    detail: 'Purplebricks'' consumer product segmentation — search, sold house prices, free valuation,
      seller packages, lettings and landlord management, mortgages, conveyancing — now maps almost one-to-one
      onto the discovered microservice APIs: property-api, valuations-api, viewings-api, messaging-api,
      lettings-api, conveyancing-api, branch-api, communications-api, account-api, agent-api, feedback-api,
      workflow-api and outlook-api. None of these is DOCUMENTED as a developer product, but all thirteen
      are publicly served and self-describing.'
    segmentsWithPublicApi:
    - property
    - valuations
    - viewings
    - messaging
    - lettings
    - conveyancing
    - portal-syndication
    - communications
    - accounts
    - agents
    - feedback
    - workflow
    - calendar-sync
    segmentsWithDocumentedDeveloperApi: []
  marketSeam: Confirms the UK seam, and now with machine-readable evidence. There is no MLS and no shared
    cooperative; Purplebricks reaches buyers by feeding listings to the portals, and its branch-api models
    exactly that — RightmoveBranch, ZooplaBranch and OnTheMarketBranch registries plus per-property branch
    resolution. The open, callable UK property data remains government-published, and property-api's LandRegistry
    tag and /v1/landregistry/transactions operation show HM Land Registry consumed inside the platform,
    not just cited on a marketing page.
findings:
  summary: 'Purplebricks serves sixteen real OpenAPI 3.0.1 documents covering 194 paths and 205 operations
    across thirteen microservices — property, account, valuations, viewings, messaging, lettings, branch,
    communications, conveyancing, agent, feedback, workflow and outlook — each with a live public Swagger
    UI at https://api.purplebricks.co.uk/<service>-api/swagger/index.html. What does NOT exist is any
    developer surface around them: no portal, no documentation, no signup, no key issuance, no OAuth token
    endpoint, no /.well-known/ layer (all probes 404), no status page, no SLA, no deprecation policy,
    no changelog, no client SDK in any language, no MCP server and no GraphQL. Every operation is protected
    by a single global Bearer scheme. Errors are ASP.NET ProblemDetails (RFC 7807). No idempotency key
    exists in any of the 205 operations. RESO and OData remain absent, as expected outside North America;
    instead the branch-api models the Rightmove / Zoopla / OnTheMarket portal seam directly, and property-api
    carries a LandRegistry tag confirming the HM Land Registry dependency inside the product rather than
    only on the marketing page.'
  developerPortal: none
  portalConfirmed: false
  specsHarvested: 16
  machineReadablePublicSurface:
  - type: OpenAPI
    note: 16 OpenAPI 3.0.1 documents, one per microservice per major version; all parse.
    location: https://api.purplebricks.co.uk/<service>-api/swagger/{v1|v2}/swagger.json
  - type: SwaggerUI
    note: 13 live public Swagger UI pages, one per service.
    location: https://api.purplebricks.co.uk/<service>-api/swagger/index.html
  - type: JSON-LD
    note: schema.org RealEstateAgent graph embedded in the homepage; parsed successfully.
    location: https://www.purplebricks.co.uk/
  discoveredButUndocumented:
  - path: https://www.purplebricks.co.uk/outlook-api/v1/agent/outlook-sync
    httpStatus: 401
    note: 'Revealed only by a Disallow line in robots.txt. Authenticated, internal, agent-facing

      calendar sync. Not documented anywhere, not a developer product, and deliberately NOT

      listed as an API in apis.yml.

      '
  corporateContext: 'Founded 2014 (Michael Bruce, Kenny Bruce, David Shepherd); floated on AIM; overseas

    expansions into Australia, the US and Canada were all wound down or sold. Sold to rival

    online agent Strike for £1 in 2023 (91% shareholder approval, 2 June 2023), backed by Sir

    Charles Dunstone; Strike retired its own brand and rebranded under Purplebricks later that

    year. In 2026 the Bruce brothers returned with a significant minority stake through

    Dunstone''s Freston Ventures, Michael Bruce as CEO. Home market is now United Kingdom only.

    '
  operationsHarvested: 205
  pathsHarvested: 194

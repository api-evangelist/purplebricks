actions:
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    No real OpenAPI, Swagger, GraphQL schema, AsyncAPI or OData $metadata document was found
    anywhere on the Purplebricks estate, so no openapi/ directory was created and apis[] was
    left empty. Nothing was invented. The repo is an honest identity-only bootstrap recording
    a none-published API posture in a market with no MLS and no RESO.

openapi: 3.2.0
info:
  title: Purplebricks Property API 1.0 - Platform Property Search…
  description: '### All Ex Uber Property related controllers are here.

    ### Purplebricks Property API Git Repository'
  version: '1.0'
servers:
- url: https://api.purplebricks.co.uk/property-api
security:
- Bearer: []
tags:
- name: PropertySearchHits
paths:
  /v1/propertysearchhits/{id}:
    get:
      tags:
      - PropertySearchHits
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Purplebricks.Property.Domain.Models.PropertySearchHits'
            application/json:
              schema:
                $ref: '#/components/schemas/Purplebricks.Property.Domain.Models.PropertySearchHits'
            text/json:
              schema:
                $ref: '#/components/schemas/Purplebricks.Property.Domain.Models.PropertySearchHits'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      summary: Get propertysearchhits by id
      x-summary-source: derived
      operationId: getV1PropertysearchhitsById
      x-operation-id-source: derived
components:
  schemas:
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Purplebricks.Property.Domain.Models.PropertySearchHits:
      type: object
      properties:
        total:
          type: integer
          format: int32
        lastSevenDays:
          type: integer
          format: int32
        totalIncludingOtherPortals:
          type: integer
          format: int32
        lastSevenDaysIncludingOtherPortals:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Authorization header using Bearer scheme
      name: Authorization
      in: header

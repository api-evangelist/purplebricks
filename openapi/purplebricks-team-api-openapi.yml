openapi: 3.2.0
info:
  title: Purplebricks.Agent.Api 1.0 - Squad Agents Experience Team…
  description: '### API agregating all agents specific functionality and endpoints

    ### Purplebricks.Agent.Api Git Repository'
  version: '1.0'
servers:
- url: https:///agent
security:
- Bearer: []
tags:
- name: Team
paths:
  /v1/team:
    get:
      tags:
      - Team
      parameters:
      - name: agentEmail
        in: query
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentTeam'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeam'
            text/json:
              schema:
                $ref: '#/components/schemas/AgentTeam'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Get team
      x-summary-source: derived
      operationId: getV1Team
      x-operation-id-source: derived
  /v1/team/getagentmanager:
    get:
      tags:
      - Team
      parameters:
      - name: agentEmail
        in: query
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentTeamMember'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeamMember'
            text/json:
              schema:
                $ref: '#/components/schemas/AgentTeamMember'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Get team getagentmanager
      x-summary-source: derived
      operationId: getV1TeamGetagentmanager
      x-operation-id-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    AgentTeam:
      type: object
      properties:
        me:
          $ref: '#/components/schemas/AgentTeamMember'
        teamMembers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AgentTeamMember'
      additionalProperties: false
    AgentTeamMember:
      type: object
      properties:
        activeDirectoryId:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        forename:
          type:
          - string
          - 'null'
        surname:
          type:
          - string
          - 'null'
        department:
          type:
          - string
          - 'null'
        preferredLanguage:
          type:
          - string
          - 'null'
        isManager:
          type: boolean
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Authorization header using Bearer scheme
      name: Authorization
      in: header

        confirmation:
          $ref: '#/components/schemas/Purplebricks.Viewings.Business.ViewModels.BookViewingConfirmationViewModel'
        mainImageUrl:
          type:
          - string
          - 'null'
        userId:
          type: integer
          format: int32
        closingDate:
          type:
          - string
          - 'null'
          format: date-time
        hasAccompaniedViewing:
          type: boolean
        accompaniedViewingExpertId:
          type:
          - integer
          - 'null'
          format: int32
        expertId:
          type: integer
          format: int32
      additionalProperties: false
    Purplebricks.Viewings.Business.ViewModels.EventUserDetailsViewModel:
      type: object

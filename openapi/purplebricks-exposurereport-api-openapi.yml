        advertViews:
          type:
          - string
          - 'null'
        buyerFunnel:
          type:
          - string
          - 'null'
        viewingsFeedback:
          type:
          - string
          - 'null'
        keyInsightsIntro:
          type:
          - string
          - 'null'
        actionPlanIntro:
          type:
          - string
          - 'null'
        highlightsIntro:
          type:
          - string
          - 'null'
      additionalProperties: false
    Purplebricks.Property.Business.ViewModels.ExposureOfferItem:
      type: object
      properties:
        amount:
          type: number
          format: double
        date:
          type: string
          format: date-time
        status:
          type:
          - string
          - 'null'
      additionalProperties: false
    Microsoft.AspNetCore.Mvc.ProblemDetails:

          format: int32
        negotiating:
          type: integer
          format: int32
        declined:
          type: integer
          format: int32
        activeOffersCount:
          type: integer
          format: int32
        offerList:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Purplebricks.Property.Business.ViewModels.ExposureOfferItem'
      additionalProperties: false
    Purplebricks.Property.Business.ViewModels.MarketNewsItem:
      type: object
      properties:

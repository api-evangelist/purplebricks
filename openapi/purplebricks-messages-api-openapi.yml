          - 'null'
        read:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    Purplebricks.Messaging.Business.Messages.Models.MessageRequestModel:
      type: object
      properties:
        threadId:
          type:
          - string
          - 'null'
          format: uuid
        senderId:
          type: integer
          format: int32
        recipientId:
          type: integer
          format: int32
        propertyId:
          type:
          - integer
          - 'null'
          format: int32
        subject:
          type:
          - string
          - 'null'
        body:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
      additionalProperties: false
    Purplebricks.Messaging.Business.Messages.Models.PageInfoResponseModel:

      - Valuation
      summary: Fetch saved form data for a property.
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Purplebricks.Valuations.Repository.Dtos.SavedValuationDto'
            application/json:
              schema:
                $ref: '#/components/schemas/Purplebricks.Valuations.Repository.Dtos.SavedValuationDto'
            text/json:
              schema:
                $ref: '#/components/schemas/Purplebricks.Valuations.Repository.Dtos.SavedValuationDto'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '404':

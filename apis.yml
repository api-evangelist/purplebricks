    plus an 11-path v2), covering the property record end to end: active, preactive, inactive and
    withdrawn properties, property boxes, owners, address lookup, go-to-market and instant-instruct
    flows, tracked properties, property search hits, seller and agent dashboards, exposure, performance
    and internal performance reports, property questionnaire forms, railway-station proximity, Countrywide
    and Land Registry lookups. Bearer-token protected and undocumented outside the live Swagger UI
    it serves itself.'

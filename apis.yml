name: Purplebricks
kind: company
description: >-
  Purplebricks is the United Kingdom's largest online (hybrid) estate agency,
  founded in 2014 by Michael and Kenny Bruce and David Shepherd, selling and letting
  residential property across England, Wales and Scotland through a fixed-fee, remote
  model staffed by local property experts rather than a high-street branch network.
  After a 2023 sale to rival online agent Strike for a nominal £1 the combined business
  was rebranded back under the Purplebricks name, and in 2026 the founding Bruce brothers
  returned alongside Sir Charles Dunstone's Freston Ventures. It sits on the brokerage
  rung of the value chain — it originates the seller relationship and the listing, then
  distributes that stock to Rightmove, Zoopla, OnTheMarket and PrimeLocation through the
  UK's portal feed arrangements, because the UK has no MLS and therefore no shared
  cooperative data exchange. API posture, stated honestly, is none-published: no developer,
  partner or API portal exists, developer./developers./docs. do not resolve, api.purplebricks.co.uk
  answers only with an Azure Front Door 404, and no OpenAPI, Swagger, GraphQL or OData
  $metadata contract is served anywhere on the estate. The one API path that is publicly
  discoverable — /outlook-api/v1/agent/outlook-sync, disallowed in robots.txt — returns 401
  and is an internal agent-facing calendar sync, not a developer product. RESO is absent, as
  expected outside North America. The only machine-readable public surface is schema.org
  JSON-LD embedded in its pages, and the genuinely open UK property data layer it consumes
  for its sold-prices tool belongs to government (HM Land Registry), not to Purplebricks.

aid: purplebricks
url: https://raw.githubusercontent.com/api-evangelist/purplebricks/refs/heads/main/apis.yml
name: Purplebricks
kind: company
description: 'Purplebricks is the United Kingdom''s largest online (hybrid) estate agency, founded
  in 2014 by Michael and Kenny Bruce and David Shepherd, selling and letting residential property
  across England, Wales and Scotland through a fixed-fee, remote model staffed by local property
  experts rather than a high-street branch network. After a 2023 sale to rival online agent Strike
  for a nominal one pound the combined business was rebranded back under the Purplebricks name, and
  in 2026 the founding Bruce brothers returned alongside Sir Charles Dunstone''s Freston Ventures.
  It sits on the brokerage rung of the value chain, originating the seller relationship and the listing
  and then distributing that stock to Rightmove, Zoopla, OnTheMarket and PrimeLocation through the
  UK''s portal feed arrangements, because the UK has no MLS and therefore no shared cooperative data
  exchange. Its API posture is best described as published-but-undeclared: there is no developer
  portal, no partner programme, no signup and no documentation site, yet the estate serves sixteen
  real OpenAPI 3.0.1 documents and thirteen live public Swagger UIs across api.purplebricks.co.uk
  and www.purplebricks.co.uk, covering property, account, valuations, viewings, messaging, lettings,
  branch/portal syndication, communications, conveyancing, agent, feedback, workflow and Outlook
  calendar sync. Every operation is Bearer-token protected with no public key issuance, errors are
  ASP.NET ProblemDetails (RFC 7807), and the branch service exposes the Rightmove, Zoopla and OnTheMarket
  syndication seam directly. RESO is absent, as expected outside North America, and the genuinely
  open UK property data layer it consumes for its sold-prices tool belongs to government (HM Land
  Registry), not to Purplebricks.'
